services:
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      PORT: 3001
    expose:
      - "3001"
    volumes:
      - uploads:/app/uploads

  web:
    build:
      context: ./client
      dockerfile: Dockerfile
    restart: unless-stopped
    # Sin "ports": Traefik (Dokploy) ya usa el 80/443 del host.
    # El dominio se configura en la pestaña Domains apuntando a este servicio, puerto 80.
    expose:
      - "80"
    depends_on:
      - api

volumes:
  uploads: